name = "FinNews AI"
description = "A financial news dashboard with live NewsAPI articles and Groq AI summaries."
tagline = "Understand financial news in minutes."

# Connect these APIs on the existing project's Setup page. Credentials are
# stored and attached by Hatchable's gateway, never sent to the browser.
[[api]]
name = "newsapi"
base_url = "https://newsapi.org/v2"
auth = "api_key"

[[api]]
name = "groq"
base_url = "https://api.groq.com/openai/v1"
auth = "api_key"
