<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="FinNews AI - AI-powered financial news simplification dashboard" />
  <title>FinNews AI </title>
  <style>
    :root {
      --bg: #070b11;
      --panel: #111821;
      --panel-2: #17212c;
      --border: #263341;
      --text: #f4f7fb;
      --muted: #91a0b2;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-2: #60a5fa;
      --success: #22c55e;
      --danger: #ef4444;
      --shadow: 0 18px 50px rgba(0,0,0,.28);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: radial-gradient(circle at 20% -10%, rgba(59,130,246,.16), transparent 30%), var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }

    button, input { font: inherit; }
    button { cursor: pointer; border: 0; }

    .container {
      width: min(1180px, calc(100% - 32px));
      margin: auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(18px);
      background: rgba(7,11,17,.82);
      border-bottom: 1px solid rgba(255,255,255,.06);
    }

    .nav {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -.4px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #2563eb, #60a5fa);
      color: white;
      box-shadow: 0 8px 28px rgba(37,99,235,.32);
    }

    .status-badge {
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }

    .dot.online { background: var(--success); }

    main { padding: 30px 0 70px; }

    .hero {
      padding: 20px 0 26px;
      display: grid;
      grid-template-columns: 1.35fr .65fr;
      gap: 30px;
      align-items: end;
    }

    .eyebrow {
      color: var(--accent-2);
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    h1 {
      font-size: clamp(34px, 5vw, 56px);
      line-height: 1.05;
      letter-spacing: -2px;
      margin: 12px 0 18px;
    }

    .hero p {
      color: var(--muted);
      font-size: 16px;
      margin: 0;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    .search {
      flex: 1 1 300px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 12px;
    }

    .search input {
      width: 100%;
      padding: 13px 4px;
      background: transparent;
      color: var(--text);
      border: 0;
      outline: 0;
    }

    .primary-btn {
      background: var(--accent);
      color: white;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 700;
      transition: background .15s;
    }

    .primary-btn:hover { background: var(--accent-hover); }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .filter {
      white-space: nowrap;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 999px;
    }

    .filter.active {
      color: white;
      background: rgba(59,130,246,.17);
      border-color: rgba(59,130,246,.6);
    }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 18px;
      margin-top: 20px;
    }

    .card {
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, rgba(23,33,44,.94), rgba(17,24,33,.94));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .card-image {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      background: #0e141c;
    }

    .card-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .meta {
      display: flex;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .source { color: var(--accent-2); font-weight: 700; }

    .card h3 {
      font-size: 17px;
      line-height: 1.3;
      margin: 0 0 10px;
    }

    .card p {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 16px;
    }

    .card-actions {
      margin-top: auto;
      display: flex;
      gap: 8px;
    }

    .ai-btn {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      color: white;
      background: var(--accent);
      font-weight: 700;
    }

    .article-btn {
      padding: 10px 12px;
      border-radius: 10px;
      color: var(--text);
      background: #0d141c;
      border: 1px solid var(--border);
      text-decoration: none;
      text-align: center;
      font-size: 13px;
    }

    .skeleton {
      height: 340px;
      border-radius: var(--radius);
      background: linear-gradient(90deg, #101720, #1a2530, #101720);
      background-size: 200% 100%;
      animation: shimmer 1.3s infinite;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* AI Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(8px);
      z-index: 50;
      display: none;
      padding: 20px;
    }

    .modal-backdrop.show { display: grid; place-items: center; }

    .modal {
      width: min(760px, 100%);
      max-height: 85vh;
      overflow-y: auto;
      background: #101720;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 26px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
    }

    .close {
      background: var(--panel-2);
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      font-size: 20px;
    }

    .ai-block {
      padding: 16px;
      background: #0c131b;
      border: 1px solid var(--border);
      border-radius: 14px;
      margin: 12px 0;
    }

    .ai-block h4 {
      margin: 0 0 8px;
      color: var(--accent-2);
    }

    .term {
      display: inline-block;
      padding: 6px 10px;
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 8px;
      margin: 4px;
      font-size: 13px;
    }

    @media (max-width: 900px) {
      .hero { grid-template-columns: 1fr; }
      .news-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      .news-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container nav">
      <div class="brand">
        <div class="brand-mark">F</div>
        <span>FinNews AI</span>
      </div>
      <div class="status-badge">
        <div class="dot" id="statusDot"></div>
        <span id="statusText">Checking Backend...</span>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div>
        <div class="eyebrow">AI-Powered Financial News Simplifier</div>
        <h1>Understand complex financial market news in seconds.</h1>
        <p>Real-time news processing powered by NewsAPI and Groq's LLaMA 3.3-70B model.</p>
      </div>
    </section>

    <section>
      <div class="toolbar">
        <div class="search">
          🔎
          <input id="searchInput" type="search" placeholder="Search inflation, stocks, Federal Reserve..." />
        </div>
        <button class="primary-btn" id="searchBtn">Fetch News</button>
      </div>

      <div class="filters" id="filters">
        <button class="filter active" data-query="finance">General Finance</button>
        <button class="filter" data-query="stock market">Markets</button>
        <button class="filter" data-query="inflation interest rates">Economy</button>
        <button class="filter" data-query="technology business">Tech & Biz</button>
      </div>
    </section>

    <section class="news-grid" id="newsGrid"></section>
  </main>

  <!-- AI Summary Modal -->
  <div class="modal-backdrop" id="summaryModal">
    <div class="modal">
      <div class="modal-head">
        <div>
          <div class="eyebrow">AI Simplification</div>
          <h2 id="summaryTitle" style="margin: 4px 0 0;">Analyzing...</h2>
        </div>
        <button class="close" id="closeModal">×</button>
      </div>
      <div id="aiContent" style="margin-top:20px;"></div>
    </div>
  </div>

  <script>
    const API_BASE = ""; // Relative URL pointing to same FastAPI host
    let currentArticles = [];

    const $ = (id) => document.getElementById(id);

    async function checkHealth() {
      try {
        const res = await fetch(`${API_BASE}/health`);
        const data = await res.json();
        if (data.status === "healthy") {
          $("statusDot").classList.add("online");
          $("statusText").textContent = "Backend Connected";
        }
      } catch (err) {
        $("statusText").textContent = "Backend Offline";
      }
    }

    function renderSkeletons() {
      $("newsGrid").innerHTML = Array.from({ length: 6 })
        .map(() => `<div class="skeleton"></div>`)
        .join("");
    }

    async function fetchNews(query = "finance") {
      renderSkeletons();
      try {
        const res = await fetch(`${API_BASE}/api/news?query=${encodeURIComponent(query)}`);
        const data = await res.json();
        
        if (!res.ok) throw new Error(data.detail || "Error loading news");

        currentArticles = data.articles;
        renderArticles(currentArticles);
      } catch (err) {
        $("newsGrid").innerHTML = `
          <div style="grid-column: 1/-1; text-align:center; padding: 40px; border:1px dashed var(--border); border-radius:18px;">
            <h3>Failed to load financial news</h3>
            <p style="color:var(--muted);">${err.message}</p>
          </div>`;
      }
    }

    function renderArticles(articles) {
      if (!articles.length) {
        $("newsGrid").innerHTML = `<div style="grid-column: 1/-1; text-align:center;">No news articles found.</div>`;
        return;
      }

      $("newsGrid").innerHTML = articles.map((art, idx) => `
        <article class="card">
          <img class="card-image" src="${art.urlToImage || 'https://placehold.co/800x450/111821/60a5fa?text=FinNews+AI'}" alt="" onerror="this.src='https://placehold.co/800x450/111821/60a5fa?text=FinNews+AI'" />
          <div class="card-body">
            <div class="meta">
              <span class="source">${art.source.name}</span>
              <span>•</span>
              <span>${new Date(art.publishedAt).toLocaleDateString()}</span>
            </div>
            <h3>${art.title}</h3>
            <p>${(art.description || '').slice(0, 120)}...</p>
            <div class="card-actions">
              <button class="ai-btn" onclick="simplifyArticle(${idx})">✨ Fetch & Simplify</button>
              <a class="article-btn" href="${art.url}" target="_blank">Read Original</a>
            </div>
          </div>
        </article>
      `).join("");
    }

    async function simplifyArticle(index) {
      const art = currentArticles[index];
      $("summaryModal").classList.add("show");
      $("summaryTitle").textContent = art.title;
      $("aiContent").innerHTML = `<p style="color:var(--muted);">Analyzing article with Groq LLaMA 3.3-70B...</p>`;

      try {
        const res = await fetch(`${API_BASE}/api/simplify`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title: art.title,
            description: art.description,
            content: art.content,
            source_name: art.source.name
          })
        });

        const result = await res.json();
        if (!res.ok) throw new Error(result.detail || "AI processing failed");

        renderAISummary(result.data);
      } catch (err) {
        $("aiContent").innerHTML = `<div class="ai-block"><h4>Error</h4><p>${err.message}</p></div>`;
      }
    }

    function renderAISummary(data) {
      const termsHtml = data.key_terms.map(t => `<span class="term"><strong>${t.term}:</strong> ${t.meaning}</span>`).join("");
      const takeawaysHtml = data.key_takeaways.map(pt => `<li>${pt}</li>`).join("");

      $("aiContent").innerHTML = `
        <div class="ai-block">
          <h4>Short Summary</h4>
          <p>${data.summary}</p>
        </div>
        <div class="ai-block">
          <h4>What Happened?</h4>
          <p>${data.what_happened}</p>
        </div>
        <div class="ai-block">
          <h4>Why It Matters</h4>
          <p>${data.why_it_matters}</p>
        </div>
        <div class="ai-block">
          <h4>Key Financial Terms Explained</h4>
          <div>${termsHtml || 'No specific complex terms found.'}</div>
        </div>
        <div class="ai-block">
          <h4>Key Takeaways</h4>
          <ul>${takeawaysHtml}</ul>
        </div>
        <div class="ai-block">
          <h4>Beginner-Friendly Explanation</h4>
          <p>${data.beginner_explanation}</p>
        </div>
      `;
    }

    // Event Handlers
    $("closeModal").onclick = () => $("summaryModal").classList.remove("show");
    $("searchBtn").onclick = () => {
      const q = $("searchInput").value.trim();
      if (q) fetchNews(q);
    };

    document.querySelectorAll(".filter").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".filter").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        fetchNews(btn.dataset.query);
      };
    });

    // Initialize
    checkHealth();
    fetchNews();
  </script>
</body>
</html>
